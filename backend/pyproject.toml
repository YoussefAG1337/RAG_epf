[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-course-rag-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "google-genai>=1.0,<2",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "openpyxl>=3.1,<4",
  "pymupdf>=1.24,<2",
  "rapidfuzz>=3.9,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pypdf>=5,<6",
  "types-openpyxl>=3.1,<4",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
