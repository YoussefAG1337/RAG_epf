services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_rag}
      POSTGRES_USER: ${POSTGRES_USER:-course_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-course_rag} -d ${POSTGRES_DB:-course_rag}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_HOST: database
      PDF_SOURCE_DIR: /app/data/course-pdfs
      DATABASE_NAME: ${POSTGRES_DB:-course_rag}
      DATABASE_USER: ${POSTGRES_USER:-course_rag}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RAG_PROVIDER: ${RAG_PROVIDER:-deterministic}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-}
      ANSWER_MODEL: ${ANSWER_MODEL:-gemini-3.8-flash}
      OPENAI_ANSWER_MODEL: ${OPENAI_ANSWER_MODEL:-gpt-4.1-mini}
      GROQ_ANSWER_MODEL: ${GROQ_ANSWER_MODEL:-openai/gpt-oss-20b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      RETRIEVAL_LIMIT: ${RETRIEVAL_LIMIT:-8}
      EVIDENCE_MINIMUM_SCORE: ${EVIDENCE_MINIMUM_SCORE:-0.35}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - type: bind
        source: ${PDF_SOURCE_DIR:-./data/course-pdfs}
        target: /app/data/course-pdfs
        bind:
          create_host_path: true
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/readiness', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
